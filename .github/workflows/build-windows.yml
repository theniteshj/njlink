name: Build NJLINK Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'core/**'
      - 'scripts/**'
      - 'Cargo.*'
      - '.github/workflows/build-windows.yml'

env:
  CARGO_TERM_COLOR: always
  QT_VERSION: "6.12.0"

jobs:
  windows-installer:
    name: Build Windows Installer (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
          aqtsource: git+https://github.com/miurahr/aqtinstall.git

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis --yes --no-progress
          }

      - name: Build and Package Installer
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: NJLINK-Windows-Installer
          path: target/package/*-setup.exe
          retention-days: 30
