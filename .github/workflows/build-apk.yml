name: Build NJLINK APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain & Android targets
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-linux-android armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install --locked cargo-ndk

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "16111833"
          packages: "platforms;android-37.0 ndk;30.0.16248370"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease -Pnjlink.abis=arm64-v8a,armeabi-v7a --stacktrace

      - name: Prepare APK for download
        run: |
          mkdir -p output
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} output/NJLINK-Release.apk \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NJLINK-Android-APK
          path: output/*.apk
          retention-days: 30
